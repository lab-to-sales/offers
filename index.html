<script>
  (function () {
    var VARIANTS = ['a', 'b', 'c'];
    var STORAGE_KEY = 'lts_variant';

    // 1) Allow forced override via URL: ?v=a / ?v=b / ?v=c
    //    Useful for testing or when you want to share a specific variant directly.
    var params = new URLSearchParams(window.location.search);
    var forced = params.get('v');
    if (forced && VARIANTS.indexOf(forced) !== -1) {
      try { localStorage.setItem(STORAGE_KEY, forced); } catch (e) {}
      window.location.replace(forced + '.html' + window.location.search.replace(/[?&]v=[abc]/, '').replace(/^&/, '?'));
      return;
    }

    // 2) Sticky: if a variant was already assigned, reuse it.
    var assigned = null;
    try { assigned = localStorage.getItem(STORAGE_KEY); } catch (e) {}

    if (!assigned || VARIANTS.indexOf(assigned) === -1) {
      // 3) Equal-weight random assignment for first-time visitors.
      assigned = VARIANTS[Math.floor(Math.random() * VARIANTS.length)];
      try { localStorage.setItem(STORAGE_KEY, assigned); } catch (e) {}
    }

    // 4) Preserve any UTM or other query params on redirect.
    var qs = window.location.search;
    window.location.replace(assigned + '.html' + qs);
  })();
</script>
